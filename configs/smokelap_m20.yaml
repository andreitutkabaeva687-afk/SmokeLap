experiment_name: smokelap_m20
model_type: smokelap

seed: 42
device: cuda

data:
  image_dir: 'D:/data/images'
  mask_dir: 'D:/data/masks'
  train_csv: 'D:/data/smoke/train.csv'
  val_csv: 'D:/data/smoke/val.csv'
  test_csv: 'D:/data/smoke/test.csv'
  image_size: 512
  num_classes: 9
  sequence_len: 3
  ignore_index: 255
  img_mean: [0.485, 0.456, 0.406]
  img_std: [0.229, 0.224, 0.225]

model:
  in_channels: 3
  num_classes: 9
  base_channels: 32
  memory_size: 20
  smoke_threshold: 0.50
  memory_write_strategy: smoke_gated
  use_cross_attention: true
  attention_heads: 4
  use_smoke_guided_fusion: true
  fusion_init_strength: 0.02
  fusion_max_strength: 0.10
  fusion_smoke_threshold: 0.50
  retrieval_threshold: 0.50
  retrieval_topk: 3
  retrieval_recency_weight: 0.05
  retrieval_temperature: 0.10
  use_learned_retrieval_keys: true
  retrieval_key_dim: 64
  zero_init_attention_output: false
  attention_grad_multiplier: 2.0
  use_spatial_safety_gate: true
  safety_gate_init: 0.50
  confidence_fallback: false
  return_base_logits: true
  use_convlstm_expert: true
  output_fusion_mode: smoke_classwise
  output_memory_bias: -6.0
  smoke_hidden_dim: 128
  handcrafted_dim: 5
  handcrafted_feature_mode: all

eval:
  batch_size: 1
  num_workers: 0
  smoke_level_thresholds: [0.25, 0.50, 0.75]
